<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A test report worth checking</title><desc id="desc">Conceptual illustration. A report saying passed is checked again and the fresh result says failed.</desc><defs><linearGradient id="paper"><stop stop-color="#e5eada"/><stop offset="1" stop-color="#e8d5c3"/></linearGradient></defs><rect width="1200" height="600" fill="url(#paper)"/><g transform="translate(90 130) rotate(-4 175 170)"><rect x="12" y="14" width="350" height="320" fill="#6d8264" opacity=".1"/><rect width="350" height="320" fill="#fbfaf0" stroke="#c4ccb6"/><text x="35" y="52" fill="#5b6851" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">THE FIRST REPORT</text><path d="M35 98h250M35 118h180M35 138h220" stroke="#bdc9b2" stroke-width="8"/><text x="35" y="225" fill="#287565" font-family="Georgia,serif" font-size="66">Passed</text><path d="m263 192 15 15 29-35" fill="none" stroke="#287565" stroke-width="6"/><text x="35" y="275" fill="#637159" font-family="Georgia,serif" font-size="22">A reassuring answer.</text></g><text x="600" y="275" text-anchor="middle" fill="#516248" font-family="Georgia,serif" font-style="italic" font-size="34">Check it</text><text x="600" y="315" text-anchor="middle" fill="#516248" font-family="Georgia,serif" font-style="italic" font-size="34">again.</text><path d="M535 350h130m-14-12 14 12-14 12" stroke="#7b876a" fill="none" stroke-width="3"/><g transform="translate(760 130) rotate(4 175 170)"><rect x="12" y="14" width="350" height="320" fill="#8b735b" opacity=".1"/><rect width="350" height="320" fill="#fbfaf0" stroke="#d6bca3"/><text x="35" y="52" fill="#81634d" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">THE FRESH CHECK</text><path d="M35 98h250M35 118h180M35 138h220" stroke="#d5c3ad" stroke-width="8"/><text x="35" y="225" fill="#b15b3e" font-family="Georgia,serif" font-size="66">Failed</text><path d="m265 180 34 34m0-34-34 34" fill="none" stroke="#b15b3e" stroke-width="6"/><text x="35" y="275" fill="#7a6653" font-family="Georgia,serif" font-size="22">A reason to revise.</text></g></svg>
