<text x="40" y="718" fill="#53676C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Whiskers: 95% task-bootstrap stability intervals on complete paired blocks; not population confidence intervals.</text>
<text x="40" y="746" fill="#53676C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Both repeats of D and E are required. Source labels are hypothetical; the full report body is unchanged.</text>
<text x="40" y="774" fill="#53676C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Phases differ in tasks; Sonnet also gained a native JSON constraint. Full-roster missingness bounds accompany the data.</text>
<text x="40" y="802" fill="#53676C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Phase 1: 37 invalid / 0 unattempted. Follow-up: 7 invalid / 64 unattempted. No pooled cross-phase effect is shown.</text>
